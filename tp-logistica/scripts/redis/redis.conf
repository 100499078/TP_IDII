# =====================================================================
# Redis — configuración de persistencia y memoria para la plataforma
# =====================================================================

# Red: dentro del contenedor escucha en todas las interfaces; docker compose
# publica el puerto solo en 127.0.0.1, así que desde fuera de la PC no se llega.
bind 0.0.0.0
protected-mode no
dir /data

# Persistencia AOF: registra cada escritura; fsync una vez por segundo
appendonly yes
appendfsync everysec

# Snapshot RDB además del AOF (respaldo compacto y reinicio rápido)
save 900 1
save 300 100
save 60 10000

# Memoria: tope y política de expulsión.
# volatile-lru solo expulsa claves CON vencimiento (sesiones, caché);
# nunca los streams ni el sorted set de sensores, que no tienen TTL.
maxmemory 512mb
maxmemory-policy volatile-lru

# Avisos de vencimiento de claves (para registrar en PostgreSQL las sesiones expiradas)
notify-keyspace-events Ex
