# =====================================================================
# TP Persistencia Políglota — los 5 motores de base de datos
# Uso:  docker compose up -d        (levanta todo en segundo plano)
#       docker compose ps           (estado: deben figurar "healthy")
#       docker compose down         (apaga; los datos quedan en los volúmenes)
#       docker compose down -v      (apaga y BORRA los datos)
# Los puertos se publican solo en 127.0.0.1: nadie de la red puede conectarse.
# =====================================================================
name: tp-logistica

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DB:-logistica}
      POSTGRES_USER: ${PG_USER:-tp}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-tp_clave}
      TZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pg_datos:/var/lib/postgresql/data
      # Al crear el volumen por primera vez ejecuta el DDL del esquema
      - ./scripts/postgres/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scripts/postgres/02_fase9.sql:/docker-entrypoint-initdb.d/02_fase9.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo_datos:/data/db
      # Al crear el volumen por primera vez ejecuta el script de colecciones y validadores
      - ./scripts/mongo/01_schema.js:/docker-entrypoint-initdb.d/01_schema.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tp_clave_neo4j}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "127.0.0.1:7687:7687"   # protocolo Bolt (lo usa la aplicación)
    volumes:
      - neo4j_datos:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  cassandra:
    image: cassandra:5.0
    environment:
      CASSANDRA_CLUSTER_NAME: tp-logistica
      MAX_HEAP_SIZE: 512M      # limita la memoria: la imagen por defecto toma 1/4 de la RAM
      HEAP_NEWSIZE: 128M
    ports: ["127.0.0.1:9042:9042"]
    volumes:
      - cassandra_datos:/var/lib/cassandra
      - ./scripts/cassandra:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40           # Cassandra tarda 1 a 2 minutos en arrancar

  redis:
    image: redis:7.2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis_datos:/data
      - ./scripts/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_datos:
  mongo_datos:
  neo4j_datos:
  cassandra_datos:
  redis_datos:
